<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password tool</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #14161d;
            --card-border: #232733;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --input-bg: #1f2430;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        h1, h2 {
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        /* Pretty Big Blue Info Banner */
        .info-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.4;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
            transition: transform 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }

        .info-btn:hover {
            background-color: var(--accent-blue-hover);
            transform: translateY(-2px);
        }

        .info-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        /* Controls & Form Layout */
        .section-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.5rem;
        }

        .display-box {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .display-input {
            width: 100%;
            padding: 1rem 3.5rem 1rem 1rem;
            background-color: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            font-size: 1.1rem;
            font-family: monospace;
            word-break: break-all;
        }

        .copy-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .copy-btn:hover {
            background-color: var(--accent-blue-hover);
        }

        .slider-container {
            margin-bottom: 1.25rem;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .slider-header span {
            color: var(--text-main);
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--input-bg);
            outline: none;
            accent-color: var(--accent-blue);
            cursor: pointer;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--text-muted);
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-blue);
            cursor: pointer;
        }

        .checkbox-label:hover {
            color: var(--text-main);
        }

        .btn-generate {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-generate:hover {
            opacity: 0.9;
        }

        /* Password Strength Indicator */
        .strength-meter {
            height: 8px;
            background-color: var(--input-bg);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .strength-text {
            font-size: 0.9rem;
            font-weight: 600;
            text-align: right;
            min-height: 1.2rem;
        }

        /* Strength Colors */
        .lvl-really-weak { width: 16%; background-color: #ef4444; color: #ef4444; }
        .lvl-weak        { width: 33%; background-color: #f97316; color: #f97316; }
        .lvl-mid         { width: 50%; background-color: #eab308; color: #eab308; }
        .lvl-good        { width: 66%; background-color: #84cc16; color: #84cc16; }
        .lvl-strong      { width: 83%; background-color: #22c55e; color: #22c55e; }
        .lvl-secure      { width: 100%; background-color: #06b6d4; color: #06b6d4; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Password Security and Password Generator</h1>

        <button class="info-btn" onclick="alert('Make sure to save your generated strong passwords in a secure location like Google Password Manager or a trusted dedicated password manager!')">
            <span class="info-icon">💡</span>
            <span><strong>Security Tip:</strong> Always store your strong passwords securely using standard tools like Google Password Manager or Bitwarden.</span>
        </button>

        <div class="card">
            <h2 class="section-title">Password Generator</h2>

            <div class="display-box">
                <input type="text" id="generatedPassword" class="display-input" readonly placeholder="Click generate...">
                <button class="copy-btn" onclick="copyPassword()">Copy</button>
            </div>

            <div class="slider-container">
                <div class="slider-header">
                    <label for="lengthSlider">Password Length</label>
                    <span id="lengthValue">16</span>
                </div>
                <input type="range" id="lengthSlider" min="4" max="64" value="16">
            </div>

            <div class="checkbox-grid">
                <label class="checkbox-label">
                    <input type="checkbox" id="incUppercase" checked> Uppercase (A-Z)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="incLowercase" checked> Lowercase (a-z)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="incNumbers" checked> Numbers (0-9)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="incSymbols" checked> Standard Symbols
                </label>
                <label class="checkbox-label" style="grid-column: 1 / -1;">
                    <input type="checkbox" id="incAdvanced"> Advanced Mode (Special Unicode Symbols)
                </label>
            </div>

            <button class="btn-generate" onclick="generatePassword()">Generate Password</button>
        </div>

        <div class="card">
            <h2 class="section-title">Password Security Evaluator</h2>
            <div class="display-box" style="margin-bottom: 0.5rem;">
                <input type="text" id="checkerInput" class="display-input" placeholder="Type or paste password to evaluate..." oninput="evaluatePasswordStrength(this.value)">
            </div>
            
            <div class="strength-meter">
                <div id="strengthBar" class="strength-bar"></div>
            </div>
            <div id="strengthText" class="strength-text" style="color: var(--text-muted);">Enter a password</div>
        </div>
    </div>

    <script>
        // Character sets
        const UPPERCASE = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const LOWERCASE = "abcdefghijklmnopqrstuvwxyz";
        const NUMBERS = "0123456789";
        const SYMBOLS = "!@#$%^&*()_+-=[]{}|;:,.<>?";
        
        // Custom symbols list provided in prompt
        const ADVANCED_SYMBOLS = Array.from("§㏒☈❆₢‱☊⌨𓃶꧁⋡⋢⋣⋤⋥⋦⋧⋨⋩⋪⋫⋬⋭⋮⋯⋰⋱⋲⎝𒅒ཀ𓅋◯Δ◕◔ʊϟღツ回₪⛾✎﹏ཧོ𔓎");

        // DOM Elements
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const generatedPasswordInput = document.getElementById('generatedPassword');
        const incUppercase = document.getElementById('incUppercase');
        const incLowercase = document.getElementById('incLowercase');
        const incNumbers = document.getElementById('incNumbers');
        const incSymbols = document.getElementById('incSymbols');
        const incAdvanced = document.getElementById('incAdvanced');

        // Update Slider UI Value
        lengthSlider.addEventListener('input', (e) => {
            lengthValue.textContent = e.target.value;
            generatePassword();
        });

        // Generate Password Function
        function generatePassword() {
            const length = parseInt(lengthSlider.value);
            let pool = [];

            if (incUppercase.checked) pool.push(...UPPERCASE.split(''));
            if (incLowercase.checked) pool.push(...LOWERCASE.split(''));
            if (incNumbers.checked) pool.push(...NUMBERS.split(''));
            if (incSymbols.checked) pool.push(...SYMBOLS.split(''));
            if (incAdvanced.checked) pool.push(...ADVANCED_SYMBOLS);

            if (pool.length === 0) {
                generatedPasswordInput.value = "Select at least 1 option";
                return;
            }

            let result = "";
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * pool.length);
                result += pool[randomIndex];
            }

            generatedPasswordInput.value = result;
        }

        // Copy Password to Clipboard
        function copyPassword() {
            if (!generatedPasswordInput.value || generatedPasswordInput.value.startsWith("Select")) return;
            navigator.clipboard.writeText(generatedPasswordInput.value);
            
            const copyBtn = document.querySelector('.copy-btn');
            const originalText = copyBtn.textContent;
            copyBtn.textContent = "Copied!";
            setTimeout(() => copyBtn.textContent = originalText, 1500);
        }

        // Evaluate Password Strength
        function evaluatePasswordStrength(pwd) {
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');

            // Reset classes
            bar.className = 'strength-bar';
            
            if (!pwd) {
                bar.style.width = '0%';
                text.textContent = 'Enter a password';
                text.style.color = 'var(--text-muted)';
                return;
            }

            const pwdChars = Array.from(pwd);
            const len = pwdChars.length;

            // Character diversity flags
            const hasLower = /[a-z]/.test(pwd);
            const hasUpper = /[A-Z]/.test(pwd);
            const hasNumber = /[0-9]/.test(pwd);
            const hasSymbol = /[^a-zA-Z0-9]/.test(pwd);

            let typesCount = [hasLower, hasUpper, hasNumber, hasSymbol].filter(Boolean).length;

            // Count advanced symbols
            let advancedCount = 0;
            for (let char of pwdChars) {
                if (ADVANCED_SYMBOLS.includes(char)) {
                    advancedCount++;
                }
            }

            let rating = "";
            let cssClass = "";

            // New logic based on explicit length thresholds
            if (len > 23) {
                rating = "Really Strong and Secure";
                cssClass = "lvl-secure";
            } else if (len >= 15 && len <= 23) { 
                rating = "Strong";
                cssClass = "lvl-strong";
            } else if (len >= 10 && len <= 14) {
                rating = "Good";
                cssClass = "lvl-good";
            } else {
                // Logic for lengths < 10
                if (advancedCount >= 5) {
                    rating = "Strong";
                    cssClass = "lvl-strong";
                } else if (advancedCount >= 3) {
                    rating = "Good";
                    cssClass = "lvl-good";
                } else if (advancedCount > 0) {
                    rating = "Mid";
                    cssClass = "lvl-mid";
                } else {
                    // Normal calculation for < 10 characters with NO advanced symbols
                    if (len < 6 || typesCount === 1) {
                        rating = "Really Weak";
                        cssClass = "lvl-really-weak";
                    } else if (len < 9 || typesCount === 2) {
                        rating = "Weak";
                        cssClass = "lvl-weak";
                    } else {
                        rating = "Mid";
                        cssClass = "lvl-mid";
                    }
                }
            }

            bar.classList.add(cssClass);
            text.textContent = rating;
            text.className = `strength-text ${cssClass}`;
        }

        // Initial Generation on page load
        generatePassword();
    </script>
</body>
</html>
